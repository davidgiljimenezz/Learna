<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css(v=5)}">
    <link rel="stylesheet" th:href="@{/css/pages/contacto.css(v=3)}">
    <title>Contacto - Learna</title>
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contacto-container">

        <div class="contacto-header">
            <h1>Contacto</h1>
            <p>¿Tienes alguna duda? Escríbenos y te responderemos lo antes posible.</p>
        </div>

        <!-- Mensaje de éxito -->
        <div class="mensaje-exito" th:if="${param.enviado}">
            ✅ ¡Mensaje enviado correctamente! Te responderemos pronto.
        </div>

        <form class="contacto-form" th:action="@{/contacto}" th:object="${contacto}" method="post" novalidate>
            <p class="error-campo" th:each="error : ${#fields.globalErrors()}" th:text="${error}" role="alert"></p>

            <div class="form-group">
                <label>Nombre</label>
                <div class="input-wrapper">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" th:field="*{nombre}" placeholder="Tu nombre" required>
                </div>
                <p class = "error-campo"
                    th:if="${#fields.hasErrors('nombre')}"
                    th:errors="*{nombre}"></p>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" th:field="*{email}" placeholder="Tu email" required>
                </div>
                 <p class = "error-campo"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label>Asunto</label>
                <div class="input-wrapper">
                    <ion-icon name="chatbox-outline"></ion-icon>
                    <input type="text" th:field="*{asunto}" placeholder="Asunto" required>
                </div>
                <p class = "error-campo"
                    th:if="${#fields.hasErrors('asunto')}"
                    th:errors="*{asunto}"></p>
            </div>

            <div class="form-group">
                <label>Mensaje</label>
                <textarea th:field="*{mensaje}" placeholder="Escribe tu mensaje aquí..." rows="5" required></textarea>
                <p class = "error-campo"
                    th:if="${#fields.hasErrors('mensaje')}"
                    th:errors="*{mensaje}"></p>
            </div>

            <button type="submit" class="button">Enviar mensaje</button>

        </form>

    </main>

    <script th:src="@{/js/global.js(v=2)}"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
