<header xmlns:th="http://www.thymeleaf.org" th:fragment="header" class="toolbar">
        <h2>Learna</h2>

        <nav class="toolbar-links">
            <a th:href="@{/}">
                <ion-icon name="home-outline"></ion-icon>
                Inicio
            </a>
            <a th:href="@{/cursos}">
                <ion-icon name="book-outline"></ion-icon>
                Cursos
            </a>
            <a th:href="@{/contacto}">
                <ion-icon name="accessibility-outline"></ion-icon>
                Contacto
            </a>
        </nav>

        <div class="toolbar-actions">
            <a th:if="${usuarioActual == null}" th:href="@{/login}" class="btn-login-toolbar">Iniciar Sesión</a>
            <a th:if="${usuarioActual != null}" th:href="@{/mis-cursos}" class="btn-login-toolbar">Mis cursos</a>
            <form th:if="${usuarioActual != null}" th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn-login-toolbar">Salir</button>
            </form>
            <div class="dark-mode">
                <div class="circle">
                    <ion-icon class="sun" name="sunny"></ion-icon>
                    <ion-icon class="moon" name="moon"></ion-icon>
                </div>
            </div>
        </div>
    </header>
